services:
  - type: web
    name: clausewright
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: CLAUSEWRIGHT_MODEL_API_KEY
        sync: false
      - key: CW_TRUST_PROXY
        value: "true"
      - key: CW_DEFAULT_CHAIN
        value: sepolia
      - key: CW_DEMO_TOKEN_ADDRESS
        sync: false
